<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main id="desktop">

        <div class="desktop-icons">
            <div class="desktop-icon">
                <img src="imagens/XPIcon.webp" alt="">
                <span>Meu Computador</span></div>
            <div class="desktop-icon">
                <img src="" alt="">
                <span></span></div>
            <div class="desktop-icon">
                <img src="" alt="">
                <span></span></div>
            <div class="desktop-icon">
                <img src="" alt="">
                <span></span></div>
        </div>

        <div id="start-menu">
            <div class="start-header">
                <div id="start-menu-photo">

                </div>
                <div id="start-menu-name"><h1>Yago</h1></div>
            </div>
            <div class="start-body">
                <div class="start-body">
                    <div class="start-left">
                        <div class="start-apps">
                            <img src="imagens/145-1453188_ie-logo-windows-xp-internet-explorer-icon.png" alt="Internet Explorer">
                            <div class="start-app-text"><span class="start-app-name">Internet Explorer</span><span class="start-app-description">Navegador da Web</span></div>
                        </div>
                        <div class="start-apps">
                            <img src="imagens/Command Prompt.ico" alt="Command Prompt">
                            <div class="start-app-text"><span class="start-app-name">CMD</span><span class="start-app-description">Prompt de Comando</span></div>
                        </div>
                        <a class="start-apps" href="https://github.com/SatoGYago" target="_blank">
                            <img src="imagens/githublogo.png" alt="GitHub">
                            <div class="start-app-text"><span class="start-app-name">GitHub</span><span class="start-app-description">Meu perfil do GitHub</span></div>
                        </a>
                        <a class="start-apps" href="https://www.linkedin.com/" target="_blank">
                            <img src="imagens/linkedin.png" alt="LinkedIn">
                            <div class="start-app-text"><span class="start-app-name">LinkedIn</span><span class="start-app-description">Meu perfil do LinkedIn</span></div>
                        </a>
                        <div class="start-apps">
                            <img src="imagens/notepad_logo.png" alt="Bloco de Notas">
                            <div class="start-app-text"><span class="start-app-name">Bloco de Notas</span><span class="start-app-description">sobre-mim</span></div>
                        </div>
    
                    </div>
                    <div class="start-right">
                        <button class="start-app-right" data-window="documents-window">
                            <img src="imagens/documents folder.png" alt="">
                            <span>Meus documentos</span>
                        </button>

                        <button class="start-app-right" data-window="pictures-window">
                            <img src="imagens/pictures folder.png" alt="">
                            <span>Minhas imagens</span>
                        </button>

                        <button class="start-app-right" data-window="computer-window">
                            <img src="imagens/XPIcon.webp" alt="">
                            <span>Meu computador</span>
                        </button>

                        <button class="start-app-right" data-window="control-panel-window">
                            <img src="imagens/Control_Panel_XP.webp" alt="">
                            <span>Painel de controle</span>
                        </button>

                        <button class="start-app-right" data-window="search-window">
                            <img src="imagens/search_icon.png" alt="">
                            <span>Pesquisar</span>
                        </button>

                        <button class="start-app-right" data-action="run">
                            <img src="imagens/run_icon.png" alt="">
                            <span>Executar...</span>
                        </button>


                    </div>
                </div>
                <div class="start-footer">

                </div>
            </div>
        </div>
    </main>
    <footer id="taskbar">
        <button id="start-button">
            <img src="imagens/windows-xp.png" alt="">
            <span>iniciar</span>
        </button>

        <div id="taskbar-apps">
            <!--Deixa pro JS-->
        </div>

        <div id="system-tray">
            <span id="clock"></span>
        </div>
    </footer>
</body>
<script src="script.js"></script>
</html>
